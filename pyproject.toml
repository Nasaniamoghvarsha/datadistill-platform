[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datadistill"
version = "0.1.0"
description = "Ericsson BUILD hackathon 2026: distill recordings, deduplicate documents, make content AI-ready"
requires-python = ">=3.11"

[project.scripts]
datadistill = "datadistill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
